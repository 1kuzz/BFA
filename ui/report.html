<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Forms Report</title>
<style>
  :root { --brand:#10b981; --brand2:#0f766e; --ink:#dbeafe; --panel:#111c2f; --line:#2a3952; --crit:#fb7185; --warn:#fbbf24; --info:#60a5fa; }
  * { box-sizing: border-box; }
  body { font-family: Inter, ui-sans-serif, -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 24px; background: #07111f; color: var(--ink); }
  .hero { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 24px; margin-bottom:16px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(120deg,#102238,#0b302d); }
  h1 { color:#fff; font-size:24px; margin:0 0 5px; letter-spacing:-.02em; }
  h2 { margin:0 0 12px; font-size:16px; color:#fff; }
  .meta { font-size:12px; color:#9fb2cc; }
  .live { padding:7px 11px; border:1px solid #34d399; border-radius:999px; color:#6ee7b7; font-size:11px; font-weight:800; letter-spacing:.08em; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:130px; }
  .card b { font-size: 22px; display: block; }
  .crit b { color: var(--crit); } .warn b { color: var(--warn); } .info b { color: var(--info); } .ok b { color: var(--brand); }
  .charts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; flex:1; min-width:220px; }
  .chart h3 { margin: 0 0 8px; font-size: 13px; }
  .control { background:linear-gradient(135deg,#111c2f,#102b2d); border:1px solid #256e67; border-radius:14px; padding:18px; margin-bottom:16px; }
  .control-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .control-grid { display:grid; grid-template-columns:minmax(180px,1fr) minmax(160px,1fr) minmax(220px,2fr) auto; gap:8px; align-items:end; }
  .control label { display:block; color:#9fb2cc; font-size:11px; margin-bottom:5px; }
  .selection { color:#6ee7b7; font-size:12px; font-weight:700; }
  .preview { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#081421; white-space:pre-wrap; font:12px ui-monospace,monospace; display:none; max-height:260px; overflow:auto; }
  .approval { display:none; gap:8px; align-items:center; margin-top:10px; }
  .approval.show { display:flex; }
  .audit { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .audit-row { padding:8px 0; border-top:1px solid var(--line); font-size:12px; }
  .audit-row summary { display:flex; gap:12px; justify-content:space-between; cursor:pointer; }
  .audit-detail { color:#9fb2cc; white-space:pre-wrap; font:11px ui-monospace,monospace; margin:8px 0 0; }
  .audit-row small { color:#9fb2cc; }
  .controls { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { padding:9px; border:1px solid var(--line); border-radius:8px; background:#0a1626; color:var(--ink); }
  input.q { width: 260px; }
  button { background:var(--brand2); color:#fff; cursor:pointer; font-weight:650; }
  button.secondary { background:#17253a; }
  button.danger { background:#be123c; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab { padding:7px 12px; background:var(--panel); border:1px solid var(--line); border-radius:7px; cursor:pointer; font-size:13px; }
  .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  table { border-collapse:collapse; width:100%; background:var(--panel); font-size:12px; }
  th, td { border:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  th { background:#123b3a; color:#fff; position:sticky; top:0; cursor:pointer; white-space:nowrap; }
  td.long { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .wrap { overflow: auto; max-height: 68vh; }
  .empty { padding:40px; text-align:center; color:#9fb2cc; }
  @media (max-width:900px) { .control-grid { grid-template-columns:1fr; } body { padding:12px; } }
  @media print { .controls, .tabs, .control, .audit, .live { display:none; } th { position:static; } body { margin:0; background:#fff; color:#222; } }
</style>
</head>
<body>
  <header class="hero">
    <div><h1>BFA Control Center</h1><div class="meta" id="meta"></div></div>
    <span class="live">LIVE GOVERNANCE</span>
  </header>

  <div id="dashboard" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="charts" id="charts"></div>

    <section class="control" aria-labelledby="controlTitle">
      <div class="control-head">
        <div><h2 id="controlTitle">Управление формами</h2><div class="selection" id="selection">Выбрано: 0</div></div>
        <div><button class="secondary" id="selectShown">Выбрать отфильтрованные</button> <button class="secondary" id="clearSelected">Очистить</button></div>
      </div>
      <div class="control-grid">
        <div><label for="editKind">Изменение</label><select id="editKind">
          <option value="name">Имя формы</option><option value="title">Заголовок</option>
          <option value="buttonCaption">Текст кнопки</option><option value="successUrl">HTTPS-редирект</option>
          <option value="preset">Существующее preset-поле</option><option value="required">Обязательность поля</option>
          <option value="visible">Видимость поля</option>
        </select></div>
        <div id="fieldWrap" style="display:none"><label for="editField">Поле</label><input id="editField" placeholder="CONTACT_EMAIL"></div>
        <div><label for="editValue">Новое значение</label><input id="editValue" placeholder="Введите значение"><select id="editBoolean" style="display:none"><option value="true">Да</option><option value="false">Нет</option></select></div>
        <button id="previewEdits">Preview</button>
      </div>
      <div class="preview" id="editPreview"></div>
      <div class="approval" id="approval"><input id="confirmation" placeholder="Строка подтверждения"><button class="danger" id="applyEdits">Применить и проверить</button></div>
    </section>

    <section class="audit"><h2>Журнал изменений</h2><div id="audit">Изменений пока нет.</div></section>

    <div class="tabs" id="tabs"></div>

    <div class="controls">
      <input class="q" id="q" placeholder="Поиск...">
      <select id="sev"><option value="">Все severity</option><option>CRIT</option><option>WARN</option><option>INFO</option><option>OK</option></select>
      <button id="print">🖨 Печать / PDF</button>
    </div>

    <div class="wrap"><table id="t"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="empty" id="empty">
    Нет данных. Откройте вкладку Bitrix24, затем запустите анализ из попапа расширения.
  </div>

  <script src="report.js"></script>
</body>
</html>
