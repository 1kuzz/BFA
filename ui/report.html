<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Forms Report</title>
<style>
  :root { --brand:#1F6F5C; --crit:#c0392b; --warn:#b7791f; --info:#2b6cb0; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 20px; background: #f5f6f8; color: #222; }
  h1 { color: var(--brand); font-size: 22px; margin: 0 0 2px; }
  .meta { font-size: 12px; color: #888; margin-bottom: 16px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card b { font-size: 22px; display: block; }
  .crit b { color: var(--crit); } .warn b { color: var(--warn); } .info b { color: var(--info); } .ok b { color: var(--brand); }
  .charts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .chart { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); flex: 1; min-width: 220px; }
  .chart h3 { margin: 0 0 8px; font-size: 13px; }
  .controls { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  input.q { width: 260px; }
  button { background: var(--brand); color: #fff; border: none; cursor: pointer; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab { padding: 7px 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 12px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--brand); color: #fff; position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
  td.long { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .wrap { overflow: auto; max-height: 68vh; }
  .empty { padding: 40px; text-align: center; color: #888; }
  @media print { .controls, .tabs { display: none; } th { position: static; } body { margin: 0; } }
</style>
</head>
<body>
  <h1>Анализ форм Bitrix24</h1>
  <div class="meta" id="meta"></div>

  <div id="dashboard" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="charts" id="charts"></div>

    <div class="tabs" id="tabs"></div>

    <div class="controls">
      <input class="q" id="q" placeholder="Поиск...">
      <select id="sev"><option value="">Все severity</option><option>CRIT</option><option>WARN</option><option>INFO</option><option>OK</option></select>
      <button id="print">🖨 Печать / PDF</button>
    </div>

    <div class="wrap"><table id="t"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="empty" id="empty">
    Нет данных. Откройте вкладку Bitrix24, затем запустите анализ из попапа расширения.
  </div>

  <script src="report.js"></script>
</body>
</html>
